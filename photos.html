<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - LensRift</title>
    <!-- Editorial Typography: Inter & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Clean Minimalist Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <a href="./index.html">
                    <img src="images/lr-logo.png" alt="LR Logo" class="nav-logo-icon">

            <ul class="nav-links">
                <li><a href="./photos.html">Photos</a></li>
